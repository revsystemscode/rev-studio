name: CI
on:
  push:
    branches: [main, v1-code]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node .github/scripts/annotate.mjs pnpm test
      - run: node .github/scripts/annotate.mjs pnpm --filter @rev/desktop e2e
